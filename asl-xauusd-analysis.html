<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASL University — XAU/USD Market Intelligence</title>
<meta name="color-scheme" content="dark light">
<script>
  /* apply saved theme before first paint (default = dark) */
  try { document.documentElement.setAttribute('data-theme', localStorage.getItem('asl-theme') === 'light' ? 'light' : 'dark'); }
  catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://xaus.com" crossorigin>
<script>
  /* start the critical data requests immediately, before the page even finishes parsing */
  (function(){
    var B='https://xaus.com/api/v1', P=window.__pre={};
    ['/spot?compact=1','/history','/chart?symbol=xau&range=1mo&interval=60m'].forEach(function(u){
      try{ P[B+u]=fetch(B+u).then(function(r){ if(!r.ok) throw 0; return r.json(); }); P[B+u].catch(function(){}); }catch(e){}
    });
  })();
</script>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --black:#0A0A0B;
    --panel:#111214;
    --panel-2:#16181B;
    --hairline:#24272B;
    --blue:#0BB1D2;
    --blue-dim:#0A8AA3;
    --white:#F5F7F8;
    --muted:#8A9096;
    --buy:#2FBE7A;
    --sell:#E15B4D;
    --sans: 'IBM Plex Sans', sans-serif;
    --display: 'Space Grotesk', sans-serif;
    --mono: 'JetBrains Mono', monospace;
    --surface:#14181A;
    --surface-2:#17191C;
    --chart-bg:#101416;
    --h1-a:#FFFFFF;
    --h1-c:#6FE0F5;
    color-scheme:dark;
  }
  /* ===== Light theme ===== */
  :root[data-theme="light"]{
    --black:#EEF3F6;
    --panel:#FFFFFF;
    --panel-2:#F7FAFB;
    --hairline:#D9E1E6;
    --blue:#0687A2;
    --blue-dim:#056C82;
    --white:#0F1C22;
    --muted:#586A73;
    --buy:#118A50;
    --sell:#CC3D31;
    --surface:#FFFFFF;
    --surface-2:#F7FAFB;
    --chart-bg:#FFFFFF;
    --h1-a:#0F1C22;
    --h1-c:#0A9CBB;
    color-scheme:light;
  }
  :root[data-theme="light"] .hero h1{filter:none;}
  :root[data-theme="light"] .brand-title,
  :root[data-theme="light"] .tech-cell h3,
  :root[data-theme="light"] .summary p:first-of-type::first-letter{text-shadow:none;}
  :root[data-theme="light"] .verdict-box,
  :root[data-theme="light"] .chart-frame,
  :root[data-theme="light"] .tech-grid,
  :root[data-theme="light"] .levels,
  :root[data-theme="light"] .two-col,
  :root[data-theme="light"] .indicator-table,
  :root[data-theme="light"] .summary .outlook-panel,
  :root[data-theme="light"] #tech-commentary{box-shadow:0 6px 28px rgba(15,28,34,0.07);}
  body{transition:background-color .25s ease, color .25s ease;}

  /* ===== Theme toggle ===== */
  .brand-banner{position:relative;}
  .theme-toggle{
    position:absolute; top:16px; right:0;
    display:inline-flex; padding:3px; gap:2px;
    border:1px solid var(--hairline); border-radius:999px;
    background:var(--panel);
  }
  .theme-toggle button{
    display:inline-flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:11px; letter-spacing:0.05em;
    color:var(--muted); background:transparent; border:0; border-radius:999px;
    padding:6px 12px; cursor:pointer; transition:all .15s ease;
  }
  .theme-toggle button:hover{color:var(--white);}
  .theme-toggle button[aria-pressed="true"]{
    color:var(--blue); background:rgba(11,177,210,0.14);
    box-shadow:inset 0 0 0 1px rgba(11,177,210,0.45);
  }
  .theme-toggle svg{width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
  @media (max-width:640px){
    .theme-toggle{position:static; margin:0 auto 18px;}
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--black);
    color:var(--white);
    font-family:var(--sans);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 1100px 600px at 10% -10%, rgba(11,177,210,0.14), transparent 60%),
      radial-gradient(ellipse 800px 500px at 105% 12%, rgba(11,177,210,0.09), transparent 60%),
      radial-gradient(ellipse 900px 600px at 50% 45%, rgba(11,177,210,0.07), transparent 65%),
      radial-gradient(ellipse 800px 500px at 0% 80%, rgba(11,177,210,0.08), transparent 60%),
      radial-gradient(ellipse 900px 550px at 100% 100%, rgba(11,177,210,0.10), transparent 60%);
    pointer-events:none;
    z-index:0;
  }
  body::after{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(11,177,210,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(11,177,210,0.05) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 1200px 900px at 50% 0%, black, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse 1200px 900px at 50% 0%, black, transparent 75%);
    pointer-events:none;
    z-index:0;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:0 24px; position:relative; z-index:1;}

  /* ===== Logo ===== */
  .logo-wrap{
    width:64px; height:64px; margin:0 auto 14px;
    display:flex; align-items:center; justify-content:center; overflow:visible;
    background:transparent; border:none; box-shadow:none;
  }
  .logo-wrap img{
    width:100%; height:100%; object-fit:contain; display:block; background:transparent;
    mix-blend-mode:screen;
  }
  :root[data-theme="light"] .logo-wrap img{ mix-blend-mode:multiply; }
  .logo-fallback{display:none; font-family:var(--mono); font-size:10px; letter-spacing:0.08em; color:var(--muted);}

  /* ===== Top identity bar ===== */
  .idbar{
    border-bottom:1px solid var(--hairline);
    padding:16px 0;
    display:flex; justify-content:space-between; align-items:center;
  }
  .wordmark{
    font-family:var(--display); font-weight:700; font-size:15px;
    letter-spacing:0.02em; color:var(--white);
    display:flex; align-items:center; gap:10px;
  }
  .wordmark .mark{
    width:10px; height:10px; background:var(--blue); border-radius:1px;
    box-shadow:0 0 10px rgba(11,177,210,0.7);
  }
  .wordmark .sub{
    font-family:var(--mono); font-weight:400; font-size:11px; color:var(--muted); letter-spacing:0.04em;
  }
  .live-row{display:flex; align-items:center; gap:18px;}
  .live-dot{
    display:inline-flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:0.03em;
  }
  .live-dot .dot{
    width:6px; height:6px; border-radius:50%; background:var(--buy);
    box-shadow:0 0 0 0 rgba(47,190,122,0.6);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(47,190,122,0.5);}
    70%{box-shadow:0 0 0 6px rgba(47,190,122,0);}
    100%{box-shadow:0 0 0 0 rgba(47,190,122,0);}
  }
  #refresh-clock{color:var(--blue); font-weight:500;}

  /* ===== Brand banner ===== */
  .brand-banner{
    text-align:center; padding:32px 0 26px;
    border-bottom:1px solid var(--hairline);
    background:radial-gradient(ellipse 60% 100% at 50% 0%, rgba(11,177,210,0.12), transparent 70%);
  }
  .brand-title{
    font-family:var(--display); font-weight:700;
    font-size:clamp(30px, 6vw, 52px); letter-spacing:0.16em; line-height:1.1;
    color:var(--white); text-shadow:0 0 34px rgba(11,177,210,0.45);
    display:inline-flex; align-items:center; gap:18px;
  }
  .brand-title .mark{
    width:14px; height:14px; background:var(--blue); border-radius:2px;
    box-shadow:0 0 16px rgba(11,177,210,0.8);
  }
  .brand-sub{
    font-family:var(--mono); font-size:12px; letter-spacing:0.28em;
    color:var(--blue); margin-top:12px;
  }

  /* ===== Live dashboard additions ===== */
  .idbar{flex-wrap:wrap; gap:10px 20px;}
  .live-row{flex-wrap:wrap; justify-content:flex-end; gap:8px 18px;}
  .live-dot.err .dot{background:var(--sell); animation:none;}
  .live-dot.err{color:var(--sell);}
  .hero-price{font-family:var(--mono); color:var(--white); margin-left:12px; letter-spacing:0.02em;}
  .verdict-value.sell{color:var(--sell);}
  .verdict-value.neutral{color:var(--muted);}
  .level-cell.near{box-shadow:inset 0 0 0 1px rgba(11,177,210,0.75), 0 0 20px rgba(11,177,210,0.25);}
  .level-price{font-family:var(--mono); font-size:13px; color:var(--muted); margin-top:16px;}
  .level-price b{color:var(--white); font-weight:600;}
  .corr-na{color:var(--muted);}
  .corr-note, .session-status{font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:14px; line-height:1.7;}
  .session-status b{color:var(--blue); font-weight:600;}
  #tech-commentary{
    background:linear-gradient(160deg, var(--surface) 0%, var(--panel) 100%);
    border:1px solid rgba(11,177,210,0.2); border-left:2px solid var(--blue);
    padding:26px 30px; box-shadow:0 0 45px rgba(11,177,210,0.08);
  }
  #tech-commentary p{max-width:74ch; color:var(--white); font-size:15.5px; margin-bottom:14px;}
  #tech-commentary p:last-child{margin-bottom:0;}

  /* ===== Hero ===== */
  header{padding-top:8px; border-bottom:1px solid var(--hairline);}
  .hero{
    padding:36px 0 28px;
  }
  .hero .pair{
    font-family:var(--mono); font-weight:400;
    color:var(--blue); font-size:14px; letter-spacing:0.06em;
    display:block; margin-bottom:14px;
  }
  .hero h1{
    font-family:var(--display); font-weight:600;
    font-size:clamp(34px, 5vw, 52px);
    line-height:1.08;
    letter-spacing:-0.01em;
    background:linear-gradient(115deg, var(--h1-a) 15%, var(--blue) 60%, var(--h1-c) 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 26px rgba(11,177,210,0.30));
  }
  .hero p.dek{
    margin-top:16px; max-width:58ch;
    color:var(--muted); font-size:15.5px;
  }
  .verdict-box{
    display:flex; flex-wrap:wrap; align-items:center; gap:26px;
    background:linear-gradient(165deg, var(--surface) 0%, var(--panel) 60%);
    border:1px solid rgba(11,177,210,0.25);
    border-top:2px solid var(--blue);
    padding:20px 26px;
    margin-bottom:36px;
    box-shadow:0 0 40px rgba(11,177,210,0.12), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .verdict-main{display:flex; align-items:baseline; gap:16px; flex-shrink:0;}
  .verdict-label{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:0.05em;}
  .verdict-value{
    font-family:var(--display); font-weight:700;
    font-size:27px; color:var(--buy);
  }
  .verdict-sub{
    font-family:var(--mono); font-size:12px; color:var(--muted); line-height:1.5;
    padding-left:16px; border-left:1px solid var(--hairline);
  }
  .verdict-sub b{color:var(--white); font-weight:500;}

  /* ===== Section scaffolding ===== */
  section{padding:52px 0; border-bottom:1px solid var(--hairline);}
  section:last-of-type{border-bottom:none;}
  .section-head{
    display:flex; align-items:baseline; gap:16px;
    margin-bottom:28px;
  }
  .section-head .num{
    font-family:var(--mono); font-size:11px; color:var(--blue);
    letter-spacing:0.08em;
    padding:3px 8px;
    border:1px solid rgba(11,177,210,0.35);
    background:rgba(11,177,210,0.06);
  }
  .section-head h2{
    font-family:var(--display); font-weight:600; font-size:25px;
    letter-spacing:0.01em;
    background:linear-gradient(100deg, var(--h1-a) 20%, var(--blue) 85%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(11,177,210,0.22));
  }
  .section-head .rule{
    flex:1; height:1px;
    background:linear-gradient(90deg, var(--hairline), rgba(11,177,210,0.4) 40%, var(--hairline));
  }
  .section-note{font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:-18px; margin-bottom:24px;}

  /* ===== Chart embed ===== */
  .chart-frame{
    border:1px solid rgba(11,177,210,0.18);
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(11,177,210,0.10), transparent 70%),
      linear-gradient(180deg, var(--chart-bg) 0%, var(--panel) 100%);
    height:520px;
    box-shadow:0 0 50px rgba(11,177,210,0.10), inset 0 0 0 1px rgba(11,177,210,0.04);
    display:flex; flex-direction:column;
  }
  .chart-toolbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 18px;
    border-bottom:1px solid var(--hairline);
  }
  .chart-symbol{
    font-family:var(--mono); font-size:14px; color:var(--white);
    letter-spacing:0.02em;
  }
  #chart-last-price{color:var(--blue); font-weight:600; margin-left:6px;}
  #chart-change{font-family:var(--mono); font-size:12.5px; margin-left:8px; color:var(--muted);}
  .chart-intervals{display:flex; gap:6px;}
  .tf-btn{
    font-family:var(--mono); font-size:11.5px; letter-spacing:0.03em;
    background:transparent; color:var(--muted);
    border:1px solid var(--hairline); padding:5px 12px;
    cursor:pointer; transition:all .15s ease;
  }
  .tf-btn:hover{color:var(--white); border-color:rgba(11,177,210,0.4);}
  .tf-btn.active{color:var(--blue); border-color:var(--blue); background:rgba(11,177,210,0.08);}
  .chart-canvas-wrap{position:relative; flex:1; min-height:0;}
  #candle-chart-canvas{width:100%; height:100%; touch-action:none; cursor:crosshair; display:block;}
  .chart-intervals{flex-wrap:wrap; justify-content:flex-end;}
  .zoom-btn{min-width:32px; padding:5px 9px; font-size:14px; line-height:1;}
  .zoom-btn:first-of-type{margin-left:8px;}
  .chart-error{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:30px; font-size:13.5px; color:var(--muted);
    background:color-mix(in srgb, var(--black) 78%, transparent); line-height:1.7;
    backdrop-filter:blur(2px);
  }
  @media (pointer:coarse){ #candle-chart-canvas{touch-action:pan-y;} }
  .demo-badge{
    display:none; margin-left:12px; padding:2px 8px;
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em;
    color:var(--blue); border:1px solid rgba(11,177,210,0.5); background:rgba(11,177,210,0.08);
    vertical-align:middle;
  }
  .chart-error b{color:var(--blue); display:block; margin-bottom:6px; font-family:var(--mono);}

  /* ===== Fundamentals: newswire list ===== */
  .news-list{
    list-style:none;
    background:linear-gradient(160deg, var(--surface) 0%, var(--panel) 100%);
    border:1px solid rgba(11,177,210,0.16);
    padding:6px 24px;
    box-shadow:0 0 40px rgba(11,177,210,0.06);
  }
  .news-item{
    display:grid; grid-template-columns:100px 1fr;
    gap:24px;
    padding:20px 0;
    border-top:1px solid var(--hairline);
  }
  .news-item:first-child{border-top:none;}
  .news-time{font-family:var(--mono); font-size:13px; color:var(--muted); padding-top:2px;}
  .news-body h3{font-family:var(--sans); font-weight:600; font-size:16px; margin-bottom:6px;}
  .news-body p{color:var(--muted); font-size:14.5px;}
  .impact{
    display:inline-block; font-family:var(--mono); font-size:10.5px;
    letter-spacing:0.04em; padding:2px 7px; margin-right:8px;
    border:1px solid currentColor;
  }
  .impact.high{color:var(--sell);}
  .impact.medium{color:var(--blue);}
  .impact.low{color:var(--muted);}

  /* ===== 3-timeframe signal cards ===== */
  .tf-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:1px;}
  .tf-card{
    background:linear-gradient(165deg, var(--surface) 0%, var(--panel) 70%);
    border:1px solid rgba(11,177,210,0.18);
    display:flex; flex-direction:column;
  }
  .tf-card h4{
    font-family:var(--mono); font-size:11px; letter-spacing:0.08em; color:var(--blue);
    padding:14px 16px 0;
  }
  .tf-fallback{display:flex; padding:16px; text-align:center; height:190px; margin-top:6px; flex-direction:column; justify-content:center;}
  .tf-fallback .sig{font-size:19px; display:block; margin-bottom:8px;}
  .tf-fallback .fb-meta{font-family:var(--mono); font-size:11px; color:var(--muted);}

  /* ===== Master Confluence Score ===== */
  .master-score{
    background:linear-gradient(165deg, var(--surface) 0%, var(--panel) 60%);
    border:1px solid rgba(11,177,210,0.25); border-top:2px solid var(--blue);
    padding:20px 24px; margin-bottom:20px;
    box-shadow:0 0 40px rgba(11,177,210,0.10);
  }
  .ms-head{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:14px;}
  .ms-label{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:0.06em;}
  .ms-value{font-family:var(--display); font-weight:700; font-size:24px;}
  .ms-value.buy{color:var(--buy);} .ms-value.sell{color:var(--sell);} .ms-value.neutral{color:var(--muted);}
  .ms-chips{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .ms-chip{
    font-family:var(--mono); font-size:11px; padding:6px 12px; border-radius:999px;
    border:1px solid var(--hairline); color:var(--muted); background:var(--panel-2);
  }
  .ms-chip.buy{color:var(--buy); border-color:rgba(47,190,122,0.5); background:rgba(47,190,122,0.08);}
  .ms-chip.sell{color:var(--sell); border-color:rgba(225,91,77,0.5); background:rgba(225,91,77,0.08);}
  .ms-note{font-family:var(--sans); font-size:12.5px; color:var(--muted); line-height:1.6;}

  /* ===== Volatility gauge + position size calculator ===== */
  .vol-gauge{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .vol-dial{flex-shrink:0; width:130px; height:130px;}
  .vol-info{flex:1; min-width:180px;}
  .vol-regime{font-family:var(--display); font-weight:700; font-size:22px; margin-bottom:6px;}
  .vol-regime.low{color:var(--buy);} .vol-regime.normal{color:var(--blue);}
  .vol-regime.high{color:#E0A83A;} .vol-regime.extreme{color:var(--sell);}
  .vol-meta{font-family:var(--mono); font-size:12px; color:var(--muted); line-height:1.7;}
  .calc-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px;}
  .calc-field{display:flex; flex-direction:column; gap:6px;}
  .calc-field label{font-family:var(--mono); font-size:10.5px; color:var(--muted); letter-spacing:0.04em;}
  .calc-field input{
    font-family:var(--mono); font-size:14px; color:var(--white); background:var(--panel-2);
    border:1px solid var(--hairline); border-radius:4px; padding:8px 10px; width:100%;
  }
  .calc-field input:focus{outline:none; border-color:var(--blue);}
  .calc-result{
    display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--hairline);
    border:1px solid var(--hairline); margin-top:4px;
  }
  .calc-result .cr-cell{background:var(--panel-2); padding:14px 10px; text-align:center;}
  .cr-label{font-family:var(--mono); font-size:9.5px; color:var(--muted); letter-spacing:0.04em; margin-bottom:6px;}
  .cr-val{font-family:var(--mono); font-size:16px; color:var(--white); font-weight:600;}
  .calc-note{font-family:var(--sans); font-size:11.5px; color:var(--muted); margin-top:12px; line-height:1.6;}

  /* ===== COT (Commitment of Traders) ===== */
  .cot-summary{display:flex; gap:24px; flex-wrap:wrap; margin-bottom:16px;}
  .cot-stat{min-width:130px;}
  .cot-stat .cs-label{font-family:var(--mono); font-size:10.5px; color:var(--muted); letter-spacing:0.04em; margin-bottom:6px;}
  .cot-stat .cs-val{font-family:var(--mono); font-size:20px; color:var(--white); font-weight:600;}
  .cot-stat .cs-val.buy{color:var(--buy);} .cot-stat .cs-val.sell{color:var(--sell);}
  #cot-chart svg{width:100%; height:auto; display:block; overflow:visible;}
