
services:
  - type: web
    name: asl-university-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://asluniversity.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: asl-university-db
          property: connectionString

databases:
  - name: asl-university-db
    plan: free
